name: "Setup Bun Environment"
description: "Bunの環境セットアップ（checkout、mise、キャッシュ、install）"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      shell: bash
    # mise経由でBunの適切なバージョンをセットアップ
    - uses: jdx/mise-action@v2
      shell: bash
    # Bunの依存関係キャッシュで高速化
    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-
    # 依存関係のインストール
    - run: bun install
      shell: bash
