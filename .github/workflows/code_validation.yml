# コード品質検証ワークフロー
# プルリクエスト時にBiomeによるコード品質チェックとTypeScriptの型チェックを並列実行
name: Code Validation

on:
  pull_request: # プルリクエスト作成・更新時にトリガー

jobs:
  # Biomeによるコード品質チェック（構文・スタイル・リント）
  biome-check:
    name: Biome Check
    runs-on: ubuntu-latest
    steps:
      # Bun環境の共通セットアップ
      - uses: ./.github/actions/setup-bun
      # Biomeによるコード品質チェック実行
      - run: bun run check

  # TypeScriptの型チェック
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      # Bun環境の共通セットアップ
      - uses: ./.github/actions/setup-bun
      # TypeScriptの型チェック実行
      - run: bun run typecheck
