# コード品質検証ワークフロー
# プルリクエスト時にBiomeによるコード品質チェックとTypeScriptの型チェックを並列実行
name: Code Validation

on:
  pull_request: # プルリクエスト作成・更新時にトリガー

jobs:
  # 変更されたファイルパスを検出
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.changes.outputs.typescript }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: changes
        with:
          filters: |
            typescript:
              - '**/*.ts'
              - '**/*.tsx'
              - 'tsconfig.json'
              - 'package.json'
              - 'bun.lock'

  # Biomeによるコード品質チェック（構文・スタイル・リント）
  biome-check:
    name: Biome Check
    runs-on: ubuntu-latest
    steps:
      # リポジトリのチェックアウト
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Bun環境の共通セットアップ
      - uses: ./.github/actions/setup-bun
      # Biomeによるコード品質チェック実行
      - run: bun run check

  # TypeScriptの型チェック（TypeScript関連ファイル変更時のみ実行）
  typecheck:
    name: TypeScript Check
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # リポジトリのチェックアウト
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Bun環境の共通セットアップ
      - uses: ./.github/actions/setup-bun
      # TypeScriptの型チェック実行
      - run: bun run typecheck

  # テスト実行
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # リポジトリのチェックアウト
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Bun環境の共通セットアップ
      - uses: ./.github/actions/setup-bun
      # テスト実行
      - run: bun test
